<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Magic Timer</title>
</head>

<body>

<div id="app">

  <!-- PANTALLA INICIAL -->
  <div id="inicio">

    <!-- ZONA SECRETA PARA ABRIR CONFIGURACIÓN -->
    <div id="zonaSecreta"></div>

    <div id="configuracion">

      <input
        id="horaInput"
        type="time"
        step="1"
        value="12:00:00"
      >

      <button id="startBtn">
        START
      </button>

    </div>

  </div>


  <!-- JUEGO -->
  <div id="juego" class="oculto">

    <div id="reloj">
      12:00:00
    </div>

    <button id="salirBtn">
      &lt;
    </button>

    <div id="cartasSacadas"></div>

    <div id="mazo"></div>

    <div id="caja">
      <img
        src="https://i.ibb.co/hR4nR9Kz/IMG-8441.jpg"
        alt="Caja Bicycle"
      >
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
