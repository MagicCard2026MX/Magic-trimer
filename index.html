<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Magic Timer"
  >

  <meta name="theme-color" content="#000000">

  <title>Magic Timer</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="./style.css">

</head>


<body>

  <div id="stage">

    <!-- =================================
         CONTADOR
         ================================= -->

    <div id="seconds">
      0
    </div>


    <!-- =================================
         CAJA
         ================================= -->

    <div id="box">

      <div id="boxTop"></div>

      <div id="deckInside"></div>

    </div>


    <!-- =================================
         MAZO
         ================================= -->

    <div id="deck">

      <div class="deck-card"></div>

      <div class="deck-card"></div>

      <div class="deck-card"></div>

      <div class="deck-card"></div>

    </div>


    <!-- =================================
         CARTA SUPERIOR
         ================================= -->

    <div id="topCard">

      <img
        id="selectedCardImage"
        src=""
        alt=""
        draggable="false"
      >

    </div>


    <!-- =================================
         BOTÓN START
         ================================= -->

    <button id="startButton">
      START
    </button>


    <!-- =================================
         BOTÓN SALIR
         ================================= -->

    <button id="exitButton">
      ←
    </button>


    <!-- =================================
         APARTADO SECRETO
         ================================= -->

    <div id="cartasSecretas">

      <div class="panel-cartas">

        <div class="titulo-cartas">
          Selecciona una carta
        </div>

        <div id="listaCartas"></div>

      </div>

    </div>

  </div>


  <script src="./script.js"></script>


  <!-- SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker.register(
            "./sw.js"
          );

        }
      );

    }

  </script>

</body>

</html>
