<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111111">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Magic Timer"
  >

  <title>Magic Timer</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <div id="app">

    <!-- ================================
         INICIO
    ================================= -->

    <div id="inicio">

      <!-- Zona secreta: 3 toques -->

      <div id="zonaSecreta"></div>


      <!-- Configuración -->

      <div
        id="configuracion"
        class="configuracionOculta"
      >

        <input
          id="horaInput"
          type="time"
          step="1"
          value="12:00:00"
        >

        <button id="cerrarConfig">
          CERRAR
        </button>

      </div>


      <button id="startBtn">
        START
      </button>

    </div>


    <!-- ================================
         JUEGO
    ================================= -->

    <div
      id="juego"
      class="oculto"
    >

      <div id="reloj">
        12:00:00
      </div>


      <button id="salirBtn">
        &lt;
      </button>


      <div id="cartasSacadas"></div>


      <div id="mazo"></div>


      <div id="caja">

        <img
          src="https://i.ibb.co/hR4nR9Kz/IMG-8441.jpg"
          alt="Caja Bicycle"
          draggable="false"
        >

      </div>

    </div>

  </div>


  <script src="script.js"></script>


  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker.register(
            "service-worker.js"
          );

        }
      );

    }

  </script>

</body>

</html>
